<div class="개념이론"><p>한 위상에서 증폭기의 오차(오프셋 및 저주파(플리커) 잡음)를 표본화한 뒤, 신호 위상 동안 그 표본 값을 뺀다. 오차는 시간상 가깝게 위치한 두 표본 사이에서 상관되어 있으므로, 뺄셈을 통해 오차의 대부분을 제거할 수 있다.</p>
        <p>그 대가는 다음과 같다. 두 표본의 상관되지 않은(열) 잡음은 전력상에서 더해지므로 <b>광대역 잡음은 √2만큼 악화</b>되지만, 오프셋과 플리커는 크게 개선된다. 또한 표본화 주파수보다 높은 대역의 잡음이 대역 내로 접히므로(T5), 증폭기의 대역폭을 의도적으로 제한해야 한다.</p></div>
