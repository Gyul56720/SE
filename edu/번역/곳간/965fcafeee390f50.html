<p>칩에는 정확한 절대량이 존재하지 않는다. 저항은 ±20 %, 커패시터는 ±10 %, 문턱전압은 수십 밀리볼트씩 변동하며, 모든 것은 온도에 따라 움직인다. 하지만 데이터 컨버터는 LSB의 일부분 수준까지 안정한 기준전압을 필요로 하고, 증폭기는 자동차 동작 온도 범위 전체에 걸쳐 두 배로 뛰지 않는 바이어스 전류를 필요로 한다. 이 장은 그러한 안정성이 어디에서 오는지에 대한 것이다. 그 답은 <b>서로 반대인 두 가지 온도 의존성을 상쇄하여 구성된다</b>는 것이며, 이것이 바로 그것이 공짜가 아니고 결코 완벽할 수 없는 이유이다.</p>
