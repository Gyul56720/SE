<div class="특허속">스위치드 커패시터 분야는 오래되었고 기본 회로들은 특허 기간이 한참 지났지만, 두 계열에서 계속 청구항이 나온다. <b>오류 상쇄 방식</b>(상관이중표본화, 자동영점, 쵸퍼 안정화 증폭기, 그리고 한 상에서 오류를 측정하고 다음 상에서 빼는 모든 변형들)과 <b>증폭기 대체재</b>(링 증폭기, 동적 증폭기, 비교기 기반 스위치드 커패시터 회로)이다. 이들의 핵심은 현대 공정이 교과서가 가정하는 고이득 연산 증폭기를 만들 수 없다는 점이다. 두 계열 모두 같은 질문에 답한다. <i>연산 증폭기가 충분히 훌륭하지 않을 때 무엇을 하는가?</i></div>
