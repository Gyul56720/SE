<div class="개념이론"><p>밴드갭의 루프에는 <b>두 가지</b> 안정된 해가 존재한다: 의도된 해와, 모든 전류가 0인 해이다. 0은 완벽하게 자기 모순이 없다 — 전류가 없다는 것은 V<sub>BE</sub>가 없다는 뜻이고, 이는 전류가 없음을 의미한다 — 그리고 루프 내의 어떤 것도 이를 유용한 해와 구분해주지 못한다.</p>
        <p>시동 회로는 레퍼런스가 0에 가까울 때 작은 전류를 주입한 다음 <b>빠져나간다</b>. 두 가지 측면 모두 중요하다: 계속 도통 상태를 유지하는 시동 회로는 출력에 자체적인 온도 의존성을 추가하며, 너무 약한 시동 회로는 슬로우 코너에서 일부 칩을 죽은 상태로 남겨둔다.</p></div>
