name: Purge novel manuscripts on VM

# **VM 안의 원고를 지운다. 손으로만 켠다(workflow_dispatch).**
#
# 왜 따로 있나: 배포는 `git reset --hard origin/main` 을 쓰는데 그것은 **추적 안 되는
# 파일을 안 지운다.** 원고는 전부 .gitignore 에 있으므로(DATA.md: "원문은 어디에도 안
# 들어간다") 저장소에서 지워도 VM 에는 그대로 남는다. 실측 2026-09-14: 저장소의
# `novel/full_drift.txt` 를 지웠지만 VM 의 `novel/*.json` 은 손도 안 닿았다.
#
# 배포에 `rm` 을 넣지 않은 까닭: 그러면 **배포마다** 지운다. 파이프라인이 다시 원고를
# 낳으면 다음 배포가 또 지운다 -- 사람이 부탁한 것은 한 번 치우는 것이지 파이프라인을
# 무력화하는 것이 아니다. 그래서 켤 때만 도는 별도 워크플로다.
#
# **되돌릴 수 없다.** 원고는 추적되지 않으므로 깃 어디에도 사본이 없다. 그래서
# 기본은 `list` 이고, 지우려면 mode 를 `delete` 로 **명시해야** 한다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list = 무엇이 있는지 보기만 / delete = 실제로 지운다"
        required: true
        default: "list"
        type: choice
        options: ["list", "delete"]
      scope:
        description: "output = 파이프라인이 낳은 원고만 / all = 표본 말뭉치(corpus·holdout)까지"
        required: true
        default: "output"
        type: choice
        options: ["output", "all"]

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and purge
        uses: appleboy/ssh-action@v1.0.3
        env:
          MODE: ${{ inputs.mode }}
          SCOPE: ${{ inputs.scope }}
        with:
          host: ${{ secrets.ORACLE_SSH_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          envs: MODE,SCOPE
          script: |
            set -eu
            cd /home/ubuntu/SE
            # **저장소의 스크립트를 부른다 -- 여기 로직을 두지 않는다.** 여기 적으면
            # 검사가 못 돌린다(실측 2026-09-09 seek.sh: `bash -n` 과 grep 만으로 재다가
            # 파일이 한 줄도 안 도는 것을 놓쳤다). `tests/test_novel_purge.py` 가 저
            # 스크립트를 가짜 나무에 대고 실제로 돌린다.
            bash scripts/novel_purge.sh "$MODE" "$SCOPE" /home/ubuntu/SE/novel
