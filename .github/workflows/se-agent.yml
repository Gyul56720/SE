name: SE Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Claude에게 보낼 프롬프트"
        required: true
      channel_id:
        description: "결과 회신할 디스코드 채널(DM) ID"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Restore Claude session state
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.claude/projects
            ~/.claude/session-env
          key: claude-session-${{ vars.CLAUDE_SESSION_ID }}-${{ github.run_id }}
          restore-keys: |
            claude-session-${{ vars.CLAUDE_SESSION_ID }}-

      - name: Run agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SESSION_ID: ${{ vars.CLAUDE_SESSION_ID }}
        run: |
          SLUG=$(echo "$GITHUB_WORKSPACE" | sed 's/\//-/g')
          JSONL="$HOME/.claude/projects/${SLUG}/${SESSION_ID}.jsonl"
          if [ -f "$JSONL" ]; then
            claude -p --resume "$SESSION_ID" --permission-mode bypassPermissions "${{ inputs.prompt }}" > result.txt 2>&1 || true
          else
            claude -p --session-id "$SESSION_ID" --permission-mode bypassPermissions "${{ inputs.prompt }}" > result.txt 2>&1 || true
          fi

      - name: Save Claude session state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.claude/projects
            ~/.claude/session-env
          key: claude-session-${{ vars.CLAUDE_SESSION_ID }}-${{ github.run_id }}

      - name: Reply to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ inputs.channel_id }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, urllib.error

          content = open("result.txt", encoding="utf-8", errors="replace").read().strip()
          content = content[:1900] if content else "(빈 응답)"

          req = urllib.request.Request(
              f"https://discord.com/api/v10/channels/{os.environ['CHANNEL_ID']}/messages",
              data=json.dumps({"content": content}).encode("utf-8"),
              headers={
                  "Authorization": f"Bot {os.environ['DISCORD_BOT_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com/Gyul56720/SE, 1.0)",
              },
              method="POST",
          )
          try:
              urllib.request.urlopen(req)
          except urllib.error.HTTPError as e:
              print(e.read().decode())
              raise
          EOF
