name: Deploy to Oracle VM

on:
  push:
    branches: [main]
    paths:
      - "discord_bot_server.py"
      - "log_streamer.py"
      - "requirements.txt"
      # 봇이 실제로 실행하는 공용 모듈. 빠져 있어서 에러 분류/쿼터 로직을 고쳐도 배포가
      # 트리거되지 않았다 -- searcher.py 때와 같은 '코드가 서버에 도달하지 못하는' 경로다.
      - "bot_tools.py"
      - "quota_tracker.py"
      - "main_public.py"
      - "agent_context.py"
      - "agent_memory.py"
      - "public_agent_files.py"
      - "secret_filter.py"
      # 봇 도구가 서버에서 백그라운드로 띄우는 orchestrator 파이프라인. runs/ 는 일부러
      # 뺐다 -- 런 산출물 커밋마다 재배포가 돌면 봇 재시작이 돌던 런을 죽인다.
      - "orchestrator_tool.py"
      - "orchestrator/solve.py"
      - "orchestrator/planner.py"
      - "orchestrator/orchestrator.py"
      - "orchestrator/plan_schema.py"
      - "orchestrator/llm_pool.py"
      # 커밋 경로의 강제 장치. 이게 빠져 있어서 게이트를 새로 승격해도 서버는 옛 게이트
      # 집합으로 계속 돌았다 -- searcher.py, bot_tools.py 와 같은 '코드가 서버에 도달하지
      # 못하는' 경로이고, 하필 그 경로를 감시하는 장치 자신이 빠져 있었다. G013 이 이제
      # 이 목록과 실제 실행 파일 집합이 어긋나면 커밋을 막는다.
      - "gatekeeper.py"
      - "self_challenge.py"
      - "gates/**"
      # 서버에서 도는 점검 도구. 능력 래칫이 커밋 게이트에서 여기로 옮겨왔다.
      - "scripts/**"
      - "deploy/se-discord-bot.service"
      - "deploy/se-log-streamer.service"
      - "deploy/se-matrix-search.service"
      - "mathmetics/matrix_exponent/self_improve_loop.py"
      - "mathmetics/matrix_exponent/improve_agent.py"
      # 탐색 서비스가 실제로 실행하는 코드들. 빠져 있어서 searcher.py 를 통째로 갈아엎어도
      # 배포가 트리거되지 않았다 -- 코드가 좋아져도 서버에 도달하지 못하는 경로였다.
      - "mathmetics/matrix_exponent/searcher.py"
      - "mathmetics/matrix_exponent/verifier.py"
      - "mathmetics/matrix_exponent/optimizer.py"
      - "mathmetics/matrix_exponent/benchmarks.json"
      # 배포 스크립트 자신. 이게 없으면 배포 방식을 고쳐도 그 수정이 배포되지 않는다.
      - ".github/workflows/deploy-oracle.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_SSH_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/ubuntu/SE
            # 배포가 git pull 에서 계속 막혔다. 두 가지가 겹쳐 있었다:
            #   #36/#37: 탐색 루프가 쓰는 런타임 상태 파일이 추적 대상이라
            #            "Your local changes would be overwritten by merge" 로 중단.
            #   #38:     서버 main 이 origin 과 분기(divergent)해 pull.rebase 미설정으로
            #            "Need to specify how to reconcile divergent branches" 로 중단.
            # 이 서버는 배포 대상이지 개발 브랜치가 아니다 -- origin/main 을 정답으로 삼고
            # 작업 트리를 거기에 맞춘다. 만약을 위해 현재 HEAD 를 로컬 백업 브랜치로
            # 남겨두므로, 서버에만 있던 커밋이 있었다면 그 브랜치에서 되찾을 수 있다.
            # reset --hard 는 추적되지 않는 파일을 지우지 않으므로, 이제 gitignore 된
            # als_state.json / logs/history.jsonl 런타임 상태는 그대로 살아남는다.
            git fetch origin main
            git branch -f "deploy-backup-$(date +%Y%m%d-%H%M%S)" HEAD || true
            git reset --hard origin/main
            pip3 install --break-system-packages -r requirements.txt discord.py
            sudo cp deploy/se-discord-bot.service /etc/systemd/system/
            sudo cp deploy/se-log-streamer.service /etc/systemd/system/
            sudo cp deploy/se-matrix-search.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl restart se-discord-bot
            sudo systemctl enable --now se-log-streamer
            sudo systemctl restart se-log-streamer
            sudo systemctl status se-discord-bot --no-pager
            sudo systemctl status se-log-streamer --no-pager
            sudo systemctl enable --now se-matrix-search
            sudo systemctl restart se-matrix-search
            sudo systemctl status se-matrix-search --no-pager
