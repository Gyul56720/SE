name: Deploy to Oracle VM

on:
  push:
    branches: [main]
    paths:
      - "discord_bot_server.py"
      - "log_streamer.py"
      - "requirements.txt"
      # 봇이 실제로 실행하는 공용 모듈. 빠져 있어서 에러 분류/쿼터 로직을 고쳐도 배포가
      # 트리거되지 않았다 -- searcher.py 때와 같은 '코드가 서버에 도달하지 못하는' 경로다.
      - "bot_tools.py"
      - "quota_tracker.py"
      - "main_public.py"
      - "channels.py"
      - "agent_context.py"
      - "agent_memory.py"
      # push 가 막혔을 때 따라잡는 법. 둘 다 이것을 부른다 -- 여기만 고치고
      # 배포가 안 되면 봇은 계속 옛 방식(origin/main 에 rebase)으로 브랜치를 깨뜨린다.
      - "gitsync.py"
      - "public_agent_files.py"
      - "secret_filter.py"
      # 봇 도구가 서버에서 백그라운드로 띄우는 orchestrator 파이프라인. runs/ 는 일부러
      # 뺐다 -- 런 산출물 커밋마다 재배포가 돌면 봇 재시작이 돌던 런을 죽인다.
      - "orchestrator_tool.py"
      - "orchestrator/solve.py"
      - "orchestrator/planner.py"
      - "orchestrator/orchestrator.py"
      - "orchestrator/plan_schema.py"
      - "orchestrator/llm_pool.py"
      # 풀이 기본으로 부르는 Gemini 클라이언트. llm_pool.py 가 임포트하지만 이 목록은
      # **임포트를 따라가지 않는다** -- 파일 이름이 그대로 적혀 있어야 배포가 걸린다.
      # 이걸 빠뜨리면 gemini_http.py 만 고친 커밋은 서버에 안 간다. 다섯 번째가 될
      # 뻔했다(searcher.py · bot_tools.py · gatekeeper.py · novel/ 에 이어).
      - "orchestrator/gemini_http.py"
      # 커밋 경로의 강제 장치. 이게 빠져 있어서 게이트를 새로 승격해도 서버는 옛 게이트
      # 집합으로 계속 돌았다 -- searcher.py, bot_tools.py 와 같은 '코드가 서버에 도달하지
      # 못하는' 경로이고, 하필 그 경로를 감시하는 장치 자신이 빠져 있었다. G013 이 이제
      # 이 목록과 실제 실행 파일 집합이 어긋나면 커밋을 막는다.
      - "gatekeeper.py"
      - "self_challenge.py"
      - "gates/**"
      # 고정 명령의 배선과 격리 실행 판. 봇이 임포트한다(dispatch <- 서버,
      # sandbox/ <- bot_tools.run_experiment 와 !실험). out/ 은 .gitignore 라 안 걸린다.
      - "dispatch.py"
      # 도구 중계(!중계). 서버와 bot_tools 둘 다 임포트한다.
      - "relay.py"
      # 도구 호출 시점 게이트와 정확 편집. bot_tools 가 임포트한다.
      - "toolgate.py"
      # 같은 나무에 같은 명령을 막는다 -- run_shell 이 부른다 (2026-09-12)
      - "shellmemo.py"
      - "filetools.py"
      # 메일(send_email 도구)과 열쇠(!열쇠). 봇이 임포트한다.
      - "mailer.py"
      - "keys.py"
      - "sandbox/**.py"
      # 변경 감사(!감사)와 깃발 색인(!기억 · search_memory 가 얹어 보여줌). 둘 다
      # 봇이 dispatch 로 임포트한다. graph/ledger.jsonl 은 일부러 뺐다 -- 밤일이
      # 색인 줄을 붙일 때마다 재배포가 돌면 봇 재시작이 돌던 런을 죽인다(runs/ 와
      # 같은 이유).
      - "audit/**.py"
      - "graph/**.py"
      # 면역계 러너(!평가). ledger·questions 는 .py 가 아니라 안 걸린다 -- 평가
      # 결과 커밋마다 재배포가 돌면 안 된다(runs/ 와 같은 이유). questions.jsonl
      # 만 고친 커밋은 배포가 안 걸리니, 행을 늘릴 때는 .py 변경과 같이 밀 것.
      - "eval/**.py"
      # 역할 라우터(!경로). ledger 는 호출마다 자라므로 제외(runs/ 와 같은 이유).
      - "router/**.py"
      # 목표 원장(!목표)과 진화 현황(!진화). intent/ledger 는 사건마다 자라므로 제외.
      - "intent/**.py"
      - "evolve/**.py"
      # 위임·병렬(!위임, delegate 도구). bot_tools 가 지연 임포트한다.
      - "delegate/**.py"
      # 고치기 루프(!고치기, repair 도구). bot_tools 가 지연 임포트한다.
      - "repair/**.py"
      # 보안 자가점검(!점검, security_audit 도구). bot_tools 가 지연 임포트한다.
      - "secaudit/**.py"
      # 코드화(!코드화, codify 도구). bot_tools 가 지연 임포트한다.
      - "codify/**.py"
      # 연구(!연구, research 도구) -- 목표를 추상 질의로 풀어 수집->코드화->결론. 봇이 지연 임포트한다.
      - "research/**.py"
      # 계획 승인(!계획) -- 그림자 diff, 사람이 승인. 봇이 지연 임포트한다.
      - "plan/**.py"
      # 대화 간추리기(맥락 관리) · GitHub 쓰기(create_pr, 머지는 사람). bot_tools 가 임포트한다.
      - "compact.py"
      - "github_write.py"
      # 이스케이프 자동 수리 -- codify 가 저장 전에, 게이트가 --고치기 로 임포트한다.
      - "escapes.py"
      # 커밋 문지기(게이트·검사·CI) · CI 읽기 -- git_sync 와 on_ready 가 임포트한다.
      - "commit_guard.py"
      - "ci_watch.py"
      # 영향 분석 -- commit_guard 와 plan 이 임포트한다.
      - "impact.py"
      # 리허설 -- plan 이 승인 전에 부른다(격리 판에서 미리 돌려 본다).
      - "rehearsal.py"
      # 진입점을 세어 찾는다(배선 읽기점검·자가개선 틈). improve 가 임포트한다.
      - "entrypoints.py"
      # 증상에서 증거를 캔다(모델 안 씀). repair 가 모델보다 먼저 부른다.
      - "diagnose.py"
      # 빠른 검사를 재서 고른다. scripts/precheck.sh 가 부른다.
      - "testtimes.py"
      - "testtimes.json"
      # 자가개선(!자가개선) -- 봇이 6h 마다 돌고 동의를 구한다. 봇이 지연 임포트한다.
      - "improve/**.py"
      # 조사(!조사) -- 긴 호흡 루프. repair 가 못 풀면 봇이 배경으로 띄운다.
      - "investigate/**.py"
      # 서버에서 도는 점검 도구. 능력 래칫이 커밋 게이트에서 여기로 옮겨왔다.
      - "scripts/**"
      # 소설 파이프라인. 봇이 서브프로세스로 띄우는 코드라 임포트 폐포에 안 잡히고,
      # 그래서 G013 이 못 본다 -- searcher.py · bot_tools.py · gatekeeper.py 에 이어
      # **네 번째** '코드가 서버에 도달하지 못하는' 경로다(실측 2026-09-07:
      # GENRE=ropan 이 VM 에서 "모르는 갈래" 로 죽었다. 코드는 저장소에 있었다).
      #
      # **.py 만 건다.** targets.json · directives.json 은 VM 의 튜닝 루프가 밤새
      # 고쳐 커밋하는 것들이라, 그것까지 걸면 학습 한 바퀴마다 봇이 재시작된다 --
      # runs/ 를 일부러 뺀 것과 같은 이유다.
      - "novel/**.py"
      # 공개 채널 프롬프트가 **이름을 대고 시키는** 도구들. 봇은 이것을 임포트하지
      # 않고 run_shell 로 띄우므로 G013 의 임포트 폐포에 안 잡힌다 -- searcher.py ·
      # bot_tools.py · gatekeeper.py · novel/ · gemini_http.py 에 이어 **여섯 번째**
      # '코드가 서버에 도달하지 못하는' 경로다(실측 2026-09-09: dig/ 가 이 목록에
      # 한 줄도 없었다. 매 물음마다 도는 코드인데 dig 만 고친 커밋은 배포가 안 걸린다).
      #
      # 여기 .py 만 거는 것은 novel/ 과 같은 까닭이다 -- study/ 는 원장(json)을
      # 봇이 직접 고쳐 커밋하므로, 그것까지 걸면 문제 하나 풀 때마다 봇이 재시작된다.
      - "dig/**.py"
      - "study/**.py"
      - "coin/**.py"
      - "brief/**.py"
      - "lol/**.py"
      - "reason/**.py"
      - "brain/**.py"
      - "deploy/se-discord-bot.service"
      - "deploy/se-log-streamer.service"
      - "deploy/se-matrix-search.service"
      # 제2의 뇌 24시간 루프 (dig/harvest 를 두 시간마다). timer 라 봇을 재시작하지 않는다.
      - "deploy/se-harvest.service"
      - "deploy/se-harvest.timer"
      - "mathmetics/matrix_exponent/self_improve_loop.py"
      - "mathmetics/matrix_exponent/improve_agent.py"
      # 탐색 서비스가 실제로 실행하는 코드들. 빠져 있어서 searcher.py 를 통째로 갈아엎어도
      # 배포가 트리거되지 않았다 -- 코드가 좋아져도 서버에 도달하지 못하는 경로였다.
      - "mathmetics/matrix_exponent/searcher.py"
      - "mathmetics/matrix_exponent/verifier.py"
      - "mathmetics/matrix_exponent/optimizer.py"
      - "mathmetics/matrix_exponent/benchmarks.json"
      # 배포 스크립트 자신. 이게 없으면 배포 방식을 고쳐도 그 수정이 배포되지 않는다.
      - ".github/workflows/deploy-oracle.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_SSH_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/ubuntu/SE
            # 배포가 git pull 에서 계속 막혔다. 두 가지가 겹쳐 있었다:
            #   #36/#37: 탐색 루프가 쓰는 런타임 상태 파일이 추적 대상이라
            #            "Your local changes would be overwritten by merge" 로 중단.
            #   #38:     서버 main 이 origin 과 분기(divergent)해 pull.rebase 미설정으로
            #            "Need to specify how to reconcile divergent branches" 로 중단.
            # 이 서버는 배포 대상이지 개발 브랜치가 아니다 -- origin/main 을 정답으로 삼고
            # 작업 트리를 거기에 맞춘다. 만약을 위해 현재 HEAD 를 로컬 백업 브랜치로
            # 남겨두므로, 서버에만 있던 커밋이 있었다면 그 브랜치에서 되찾을 수 있다.
            # reset --hard 는 추적되지 않는 파일을 지우지 않으므로, 이제 gitignore 된
            # als_state.json / logs/history.jsonl 런타임 상태는 그대로 살아남는다.
            git fetch origin main
            git branch -f "deploy-backup-$(date +%Y%m%d-%H%M%S)" HEAD || true
            # 실측 2026-09-12: 조사가 PR 갈래(fix/…)를 체크아웃한 채 끝나면 reset 은 그 갈래 이름에 남는다.
            # 그러면 봇의 자동 반영 커밋이 계속 그 갈래로 밀린다(머지된 뒤에도 세 번). 배포 대상은 main 이다.
            git checkout -q -B main origin/main
            git reset --hard origin/main
            # G021: 코드(discord_pdf)가 기대는 한글 글꼴은 배포가 깐다 -- 사람에게 apt 를 시키지 않는다.
            sudo apt-get install -y fonts-nanum || (sudo apt-get update -qq && sudo apt-get install -y fonts-nanum)
            pip3 install --break-system-packages -r requirements.txt discord.py
            sudo cp deploy/se-discord-bot.service /etc/systemd/system/
            sudo cp deploy/se-log-streamer.service /etc/systemd/system/
            sudo cp deploy/se-matrix-search.service /etc/systemd/system/
            sudo cp deploy/se-harvest.service deploy/se-harvest.timer /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl restart se-discord-bot
            sudo systemctl enable --now se-log-streamer
            sudo systemctl restart se-log-streamer
            sudo systemctl status se-discord-bot --no-pager
            sudo systemctl status se-log-streamer --no-pager
            sudo systemctl enable --now se-matrix-search
            sudo systemctl restart se-matrix-search
            sudo systemctl status se-matrix-search --no-pager
            sudo systemctl enable --now se-harvest.timer
            sudo systemctl list-timers se-harvest.timer --no-pager
